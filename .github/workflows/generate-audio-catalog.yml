name: Generate Audio Catalog

on:
  push:
    branches: [main]
    paths:
      - "assets/audio/tracks/**"

permissions:
  contents: write

jobs:
  generate-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-audio-catalog.mjs
      - name: Commit updated catalog
        run: |
          if git diff --quiet -- assets/audio/catalog.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/catalog.json
          git commit -m "Update audio catalog"
          git push
